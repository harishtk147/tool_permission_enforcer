name: Pull request checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.18"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen --python 3.12

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy services tests scripts

      - name: Test
        run: uv run pytest

  containers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build service images
        run: |
          docker build -f docker/Dockerfile.proxy -t permission-proxy:ci .
          docker build -f docker/Dockerfile.crm -t sample-crm:ci .
          docker build -f docker/Dockerfile.agent -t reference-agent:ci .
